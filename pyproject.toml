[project]
name = "leaf"
version = "0.1.0"
description = "Machine unlearning for speaker data in end-to-end ASR models."
readme = "README.md"
requires-python = ">=3.12"

# Direct dependencies only. Versions match uv.lock, which is the record of what
# the published experiments actually ran against.
dependencies = [
    # Core model and training stack
    "espnet",
    "espnet-model-zoo==0.1.7",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "pytorch-lightning==2.6.0",
    "torchmetrics==1.8.2",
    "speechbrain==1.1.0",
    "transformers==5.12.1",
    # Configuration
    "hydra-core==1.3.3",
    "omegaconf==2.3.1",
    "hyperpyyaml==1.2.3",
    "pyyaml==6.0.3",
    # Experiment tracking and search
    "mlflow==3.12.0",
    "optuna==4.9.0",
    # Numerics and data
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "h5py==3.16.0",
    "tqdm==4.68.3",
    # Plotting
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
]

[tool.uv.sources]
espnet = { git = "https://github.com/espnet/espnet.git", rev = "2d139b9198f954b55444c6b359d814164bc70817" }
